<h2>Cars</h2>

<button mat-raised-button routerLink="/drivers">Go to Drivers</button>
<button mat-raised-button color="accent" (click)="openCreateForm()" [disabled]="!isAdmin()">Add New Championship</button>
<button mat-raised-button color="warn" (click)="logout()">Logout</button>

@if (dataSource().length > 0) {
  <mat-table [dataSource]="dataSource()" matSort>
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef mat-sort-header>ID</mat-header-cell>
      <mat-cell *matCellDef="let car">{{ car.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="model">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Model</mat-header-cell>
      <mat-cell *matCellDef="let car">{{ car.model }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="chassisNumber">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Chassis Number</mat-header-cell>
      <mat-cell *matCellDef="let car">{{ car.chassisNumber }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="engineManufacturer">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Engine Manufacturer</mat-header-cell>
      <mat-cell *matCellDef="let car">{{ car.engineManufacturer }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="driverName">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Driver</mat-header-cell>
      <mat-cell *matCellDef="let car">{{ car.driverName }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let car">
        <button mat-icon-button (click)="openEditForm(car)" [disabled]="!isAdmin()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(car.id)" [disabled]="!isAdmin()">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayColumns;"></mat-row>
  </mat-table>
  <mat-paginator
    [length]="cars()?.totalCount ?? 0"
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
} @else {
  <mat-spinner></mat-spinner>
}
