<h2>Cars</h2>

<div style="margin: 20px 0; display: flex; gap: 20px; align-items: center;">
  
  <mat-form-field>
    <mat-label>Sort By</mat-label>
    <mat-select [(value)]="currentSortBy" (selectionChange)="onSortChange($event.value)">
      <mat-option [value]="null">None</mat-option>
      <mat-option value="model">Model</mat-option>
      <mat-option value="enginemanufacturer">Engine Manufacturer</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Order</mat-label>
    <mat-select [(value)]="currentSortOrder" (selectionChange)="onSortOrderChange($event.value)">
      <mat-option value="asc">Ascending</mat-option>
      <mat-option value="desc">Descending</mat-option>
    </mat-select>
    
  </mat-form-field>
    <button mat-raised-button color="accent" (click)="openCreateForm()" [disabled]="!isAdmin()" style="margin-left: auto;">Add New Car</button>
  
</div>


@if (dataSource().length > 0) {
  <mat-table [dataSource]="dataSource()">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
      <mat-cell *matCellDef="let car">{{ car.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="model">
      <mat-header-cell *matHeaderCellDef>Model</mat-header-cell>
      <mat-cell *matCellDef="let car">{{ car.model }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="chassisNumber">
      <mat-header-cell *matHeaderCellDef>Chassis Number</mat-header-cell>
      <mat-cell *matCellDef="let car">{{ car.chassisNumber }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="engineManufacturer">
      <mat-header-cell *matHeaderCellDef>Engine Manufacturer</mat-header-cell>
      <mat-cell *matCellDef="let car">{{ car.engineManufacturer }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="driverName">
      <mat-header-cell *matHeaderCellDef>Driver</mat-header-cell>
      <mat-cell *matCellDef="let car">{{ car.driverName }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let car">
        <button mat-icon-button (click)="openEditForm(car)" [disabled]="!isAdmin()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(car.id)" [disabled]="!isAdmin()">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayColumns;"></mat-row>
  </mat-table>
  <mat-paginator
    [length]="cars()?.totalCount ?? 0"
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
} @else {
  <mat-spinner></mat-spinner>
}
