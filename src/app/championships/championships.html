<h2>Championships</h2>

<button mat-raised-button color="accent" (click)="openCreateForm()" [disabled]="!isAdmin()">Add New Championship</button>
<button mat-raised-button color="warn" (click)="logout()">Logout</button>

@if (dataSource().length > 0) {
  <mat-table [dataSource]="dataSource()" matSort>
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef mat-sort-header>ID</mat-header-cell>
      <mat-cell *matCellDef="let champ">{{ champ.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
      <mat-cell *matCellDef="let champ">{{ champ.name }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="year">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Year</mat-header-cell>
      <mat-cell *matCellDef="let champ">{{ champ.year }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="teamsCount">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Teams Count</mat-header-cell>
      <mat-cell *matCellDef="let champ">{{ champ.teamsCount }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="winnerName">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Winner</mat-header-cell>
      <mat-cell *matCellDef="let champ">{{ champ.winnerName }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let champ">
        <button mat-icon-button (click)="openEditForm(champ)" [disabled]="!isAdmin()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(champ.id)" [disabled]="!isAdmin()">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
  <mat-paginator
    [length]="championships()?.totalCount ?? 0"
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
} @else {
  <mat-spinner></mat-spinner>
}
