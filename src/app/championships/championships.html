<h2>Championships</h2>

<div style="margin: 20px 0; display: flex; justify-content: space-between; align-items: center;">
  <div style="display: flex; gap: 20px;">
    <mat-form-field>
      <mat-label>Search</mat-label>
      <input matInput [(ngModel)]="searchTerm" (input)="onSearchChange($event)" placeholder="Search championships...">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Sort By</mat-label>
      <mat-select [(value)]="currentSortBy" (selectionChange)="onSortChange($event.value)">
        <mat-option [value]="null">None</mat-option>
        <mat-option value="name">Name</mat-option>
        <mat-option value="year">Year</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Order</mat-label>
      <mat-select [(value)]="currentSortOrder" (selectionChange)="onSortOrderChange($event.value)">
        <mat-option value="asc">Ascending</mat-option>
        <mat-option value="desc">Descending</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <button mat-raised-button color="accent" (click)="openCreateForm()" [disabled]="!isAdmin()">Add New Championship</button>
</div>

@if (dataSource().length > 0) {
  <mat-table [dataSource]="dataSource()">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
      <mat-cell *matCellDef="let champ">{{ champ.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
      <mat-cell *matCellDef="let champ">{{ champ.name }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="year">
      <mat-header-cell *matHeaderCellDef>Year</mat-header-cell>
      <mat-cell *matCellDef="let champ">{{ champ.year }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="teamsCount">
      <mat-header-cell *matHeaderCellDef>Teams Count</mat-header-cell>
      <mat-cell *matCellDef="let champ">{{ champ.teamsCount }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="winnerName">
      <mat-header-cell *matHeaderCellDef>Champion</mat-header-cell>
      <mat-cell *matCellDef="let champ">{{ champ.winnerName }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let champ" (click)="$event.stopPropagation()">
        <button mat-icon-button (click)="openEditForm(champ)" [disabled]="!isAdmin()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(champ.id)" [disabled]="!isAdmin()">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;" (click)="onRowClick(row)" style="cursor: pointer;"></mat-row>
  </mat-table>
  <mat-paginator
    [length]="championships()?.totalCount ?? 0"
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
} @else {
  <mat-spinner></mat-spinner>
}
