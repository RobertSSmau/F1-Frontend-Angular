<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; text-align: center;">
  <h2>F1 Management</h2>

  <div class="logo-container">
    <img src="assets/images/logo-f1.png" alt="F1 Logo" class="f1-logo">
  </div>

  @if (sessionError()) {
    <div style="color: orange; margin-bottom: 20px; padding: 10px; background: #fff3cd;">
      {{ sessionError() }}
    </div>
  }
<br>
  <button 
    (click)="onLogin()" 
    style="padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px;">
    Login
  </button>
  <br>
  <button 
    (click)="onRegister()" 
    style="padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px;">
    Register
  </button>
</div>
