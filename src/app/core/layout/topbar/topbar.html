<mat-toolbar class="app-topbar">
  <button mat-icon-button (click)="toggleMenu()" class="menu-button">
    <mat-icon>menu</mat-icon>
  </button>
  
  <div class="logo-container">
    <img src="assets/images/logo-f1.png" alt="F1 Logo" class="f1-logo">
  </div>
  
  <span class="spacer"></span>
  
  <div class="user-section">
    <span class="user-name">{{ userName() }}</span>
    <img src="assets/images/avatar-placeholder.png" alt="Avatar" class="avatar-placeholder">
    <button mat-icon-button (click)="logout()" class="logout-button" title="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</mat-toolbar>
