<div>
<label for="userId">User Id</label>
<input type="text" id="userId" placeholder="Nome Utente" [(ngModel)]="userid"/>
<br>
<label for="password">Password</label>
<input type="password" id="password" placeholder="Password" [(ngModel)]="password"/>

<button (click)=gestAut()>Login</button>

<br>
<p>
    UserID è {{userid}} e password è {{password}}
</p>
</div>

<div>
@if (hasClicked() && !autenticated()) {
    <div>
        {{errMsg()}}
    </div>}
@else if (hasClicked() && autenticated()) {
    <div>
    </div>
}
</div>
