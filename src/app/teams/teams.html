<h2>Teams</h2>

<button mat-raised-button routerLink="/drivers">Go to Drivers</button>
<!-- <button mat-raised-button color="accent" (click)="openCreateForm()" [disabled]="!isAdmin()">Add New Championship</button> -->
<button mat-raised-button color="warn" (click)="logout()">Logout</button>

@if (dataSource().length > 0) {
  <mat-table [dataSource]="dataSource()" matSort>
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef mat-sort-header>ID</mat-header-cell>
      <mat-cell *matCellDef="let teams">{{ teams.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
      <mat-cell *matCellDef="let teams">{{ teams.name }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="country">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Year</mat-header-cell>
      <mat-cell *matCellDef="let teams">{{ teams.country }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="championshipName">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Championship</mat-header-cell>
      <mat-cell *matCellDef="let teams">{{ teams.championshipName }}</mat-cell>
    </ng-container>
    <!-- <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let champ">
        <button mat-icon-button (click)="openEditForm(champ)" [disabled]="!isAdmin()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(champ.id)" [disabled]="!isAdmin()">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container> -->
    <mat-header-row *matHeaderRowDef="displayColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayColumns;"></mat-row>
  </mat-table>
  <mat-paginator
    [length]="teams()?.totalCount ?? 0"
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
} @else {
  <mat-spinner></mat-spinner>
}
