<h2>Teams</h2>

<div style="margin: 20px 0; display: flex; justify-content: space-between; align-items: center;">
  <div style="display: flex; gap: 20px;">
    <mat-form-field>
      <mat-label>Search</mat-label>
      <input matInput [(ngModel)]="searchTerm" (input)="onSearchChange($event)" placeholder="Search teams...">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Sort By</mat-label>
      <mat-select [(value)]="currentSortBy" (selectionChange)="onSortChange($event.value)">
        <mat-option [value]="null">None</mat-option>
        <mat-option value="name">Name</mat-option>
        <mat-option value="country">Country</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Order</mat-label>
      <mat-select [(value)]="currentSortOrder" (selectionChange)="onSortOrderChange($event.value)">
        <mat-option value="asc">Ascending</mat-option>
        <mat-option value="desc">Descending</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <button mat-raised-button color="accent" (click)="openCreateForm()" [disabled]="!isAdmin()">Add New Team</button>
</div>

@if (dataSource().length > 0) {
  <mat-table [dataSource]="dataSource()">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
      <mat-cell *matCellDef="let teams">{{ teams.id }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
      <mat-cell *matCellDef="let teams">{{ teams.name }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="country">
      <mat-header-cell *matHeaderCellDef>Country</mat-header-cell>
      <mat-cell *matCellDef="let teams">{{ teams.country }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="championshipName">
      <mat-header-cell *matHeaderCellDef>Championship</mat-header-cell>
      <mat-cell *matCellDef="let teams">{{ teams.championshipName }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="driversCount">
      <mat-header-cell *matHeaderCellDef>Drivers</mat-header-cell>
      <mat-cell *matCellDef="let teams">{{ teams.driversCount }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let team" (click)="$event.stopPropagation()">
        <button mat-icon-button (click)="openEditForm(team)" [disabled]="!isAdmin()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(team.id)" [disabled]="!isAdmin()">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayColumns;" (click)="onRowClick(row)" [style.cursor]="championshipId ? 'pointer' : 'default'"></mat-row>
  </mat-table>
  <mat-paginator
    [length]="teams()?.totalCount ?? 0"
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
} @else {
  <mat-spinner></mat-spinner>
}
